[workspace]
members = [".", "egui_markdown_style"]
resolver = "2"

[package]
name = "egui_markdown"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A markdown parser and renderer for egui"
repository = "https://github.com/membrane-io/egui_markdown"
documentation = "https://docs.rs/egui_markdown"
categories = ["gui"]
keywords = ["egui", "markdown", "gui", "commonmark"]
include = ["**/*.rs", "examples/markdown/*.md", "tests/fixtures/*.json", "tests/fixtures/*.md", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE", "README.md"]

[dependencies]
egui = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false }
egui_markdown_style = { path = "./egui_markdown_style", version = "0.1.0" }
pulldown-cmark = "0.13.0"
syntect = { version = "5", optional = true, default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
two-face = { version = "0.5", optional = true, default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
eframe = { version = "0.37", default-features = true, features = ["default_fonts", "glow"] }
env_logger = "0.11"
serde_json = "1"

[features]
default = ["syntax_highlighting"]
syntax_highlighting = ["egui_extras/syntect", "dep:syntect"]
extra_syntaxes = ["syntax_highlighting", "dep:two-face"]
images = ["egui_extras/image", "egui_extras/http"]
svg = ["egui_extras/svg"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "code_blocks"
required-features = ["syntax_highlighting"]

[[example]]
name = "images"
required-features = ["images"]

[[bench]]
name = "markdown"
harness = false

[patch.crates-io]
ecolor = { git = "https://github.com/emilk/egui.git", branch = "main" }
eframe = { git = "https://github.com/emilk/egui.git", branch = "main" }
egui = { git = "https://github.com/emilk/egui.git", branch = "main" }
egui_extras = { git = "https://github.com/emilk/egui.git", branch = "main" }
emath = { git = "https://github.com/emilk/egui.git", branch = "main" }
epaint = { git = "https://github.com/emilk/egui.git", branch = "main" }
