name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clippy
            run: cargo clippy -- -D warnings
          - name: Doc
            run: cargo doc --no-deps
          - name: Check WASM
            run: cargo check --target wasm32-unknown-unknown --no-default-features
            target: wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: ${{ matrix.run }}

  test:
    name: Test
    # The snapshot tests need a GPU. A macOS runner has one, and the snapshots come from macOS.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable

      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # Only `main` writes to the cache, so PR caches can't evict it (10 GB repository limit).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `--no-fail-fast` runs all tests after a failure, so the artifact holds all new snapshots.
      - name: Test
        run: cargo test --no-fail-fast

      - name: Test (no default features)
        if: always()
        run: cargo test --no-default-features --no-fail-fast

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/tests/snapshots"
