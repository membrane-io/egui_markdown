name: All; .png on git LFS

on:
  # Only on `main`, so that a PR from a branch in this repo
  # doesn't run the whole workflow twice (once for the push, once for the PR):
  push:
    branches: ["main"]
  pull_request:

jobs:
  check-binary-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check that png files are on git LFS
      run: |
        binary_extensions="png"
        exclude_paths=(
          "docs/screenshots/"
        )

        # Find binary files that are not tracked by Git LFS
        for ext in $binary_extensions; do
          # Create grep pattern to exclude multiple paths
          exclude_pattern=$(printf "|^%s" "${exclude_paths[@]}" | sed 's/^|//')

          if comm -23 <(git ls-files | grep -Ev "$exclude_pattern" | sort) <(git lfs ls-files -n | sort) | grep "\.${ext}$"; then
            echo "Error: Found binary file with extension .$ext not tracked by git LFS. See https://github.com/membrane-io/egui_markdown/blob/main/CONTRIBUTING.md#snapshot-tests"
            exit 1
          fi
        done
